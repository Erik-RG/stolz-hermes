<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Maintenance</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Inter", "SF Pro Display", Arial, sans-serif;
    }

    html, body {
        width: 100%;
        min-height: 100%;
    }

    body {
        min-height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;

        background:
            radial-gradient(circle at top left, #dbeafe, transparent 40%),
            radial-gradient(circle at bottom right, #e9d5ff, transparent 40%),
            #f8fafc;

        color: #111827;
    }

    .background-circle {
        position: fixed;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.5;
        pointer-events: none;
    }

    .circle1 {
        width: 300px;
        height: 300px;
        background: #60a5fa;
        top: -100px;
        left: -100px;
    }

    .circle2 {
        width: 350px;
        height: 350px;
        background: #c084fc;
        bottom: -120px;
        right: -120px;
    }

    .card {
        position: relative;
        width: min(90%, 500px);
        padding: 50px 40px;
        text-align: center;

        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);

        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 28px;

        box-shadow:
            0 20px 60px rgba(0, 0, 0, 0.12);
    }

    .icon {
        width: 90px;
        height: 90px;
        margin: 0 auto 25px;

        display: flex;
        justify-content: center;
        align-items: center;

        border-radius: 50%;
        background: rgba(17, 24, 39, 0.06);

        font-size: 42px;
    }

    h1 {
        font-size: 36px;
        font-weight: 700;
        letter-spacing: -1px;
        margin-bottom: 15px;
    }

    p {
        color: #4b5563;
        font-size: 16px;
        line-height: 1.6;
        margin-bottom: 30px;
    }

    .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;

        padding: 12px 18px;
        border-radius: 999px;

        background: rgba(255, 255, 255, 0.7);
        font-size: 14px;
        color: #374151;
    }

    .dot {
        width: 10px;
        height: 10px;
        background: #22c55e;
        border-radius: 50%;
        animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
        0%, 100% {
            opacity: 1;
            transform: scale(1);
        }

        50% {
            opacity: 0.5;
            transform: scale(1.3);
        }
    }

    footer {
        position: fixed;
        bottom: 25px;

        font-size: 13px;
        color: #6b7280;
    }

    @media (max-width: 500px) {
        .card {
            padding: 40px 25px;
        }

        h1 {
            font-size: 30px;
        }

        p {
            font-size: 15px;
        }
    }
</style>

</head>

<body>

<div class="background-circle circle1"></div>
<div class="background-circle circle2"></div>

<div class="card">

    <div class="icon">
        🛠️
    </div>

    <h1>We'll be back soon</h1>

    <p>
        We are currently performing maintenance to improve your experience.
        The website will return shortly.
    </p>

    <div class="status">
        <span class="dot"></span>
        Maintenance in progress
    </div>

</div>

<footer>
    © 2026 Stolz Hermès • With passion comes power
</footer>

</body>
</html>
