<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stolz Hermes — Tickets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#05070d; --navy:#0d1b34; --navy-soft:#152947;
    --gold:#c9a96a; --gold-pale:#e9dcb8; --paper:#f3efe6; --steel:#8e97ab;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{ margin:0; background:var(--ink); color:var(--paper); font-family:'IBM Plex Sans',sans-serif; -webkit-font-smoothing:antialiased; }
  a{ color:inherit; }
  a:focus-visible, button:focus-visible, input:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }
  .eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:.8rem; letter-spacing:.22em; text-transform:uppercase; color:var(--gold); display:block; margin-bottom:1rem; }

  .nav{
    position:fixed; top:0; left:0; right:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    padding:1.2rem clamp(1.2rem,4vw,3rem);
    border-bottom:1px solid transparent;
    transition:background .4s ease, border-color .4s ease, padding .4s ease;
  }
  .nav--solid{ background:rgba(5,7,13,.86); backdrop-filter:blur(10px); border-bottom-color:rgba(201,169,106,.18); padding-top:.85rem; padding-bottom:.85rem; }
  .nav__mark{ display:flex; align-items:center; gap:.7rem; text-decoration:none; }
  .nav__mark-shield{
    width:34px; height:34px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:.72rem; color:var(--ink); background:var(--gold);
    clip-path:polygon(50% 0%, 100% 15%, 100% 72%, 50% 100%, 0% 72%, 0% 15%);
  }
  .nav__mark-text{ font-family:'IBM Plex Mono',monospace; font-size:.72rem; letter-spacing:.18em; color:var(--paper); }
  .nav__links{ display:flex; align-items:center; gap:clamp(1.2rem,3vw,2.4rem); }
  .nav__links a{ font-family:'IBM Plex Mono',monospace; font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--steel); text-decoration:none; transition:color .25s ease; }
  .nav__links a:hover, .nav__links a:focus-visible{ color:var(--gold-pale); }
  .nav__links-active{ font-family:'IBM Plex Mono',monospace; font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); }
  @media (max-width:640px){ .nav__links{ display:none; } }

  .ticket-hero{ position:relative; min-height:100vh; display:flex; align-items:center; overflow:hidden; }
  .ticket-hero__img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .ticket-hero__scrim{
    position:absolute; inset:0;
    background:linear-gradient(90deg, rgba(5,7,13,.25) 0%, rgba(5,7,13,.6) 45%, rgba(5,7,13,.94) 68%, rgba(5,7,13,.97) 100%);
  }
  .ticket-hero__inner{ position:relative; z-index:2; width:100%; display:flex; justify-content:flex-end; padding:6rem clamp(1.5rem,6vw,5rem) 3rem; }
  .ticket-card{
    background:rgba(13,27,52,.6); backdrop-filter:blur(8px);
    border:1px solid rgba(201,169,106,.25); border-radius:3px;
    padding:clamp(2rem,4vw,3rem); max-width:430px; width:100%;
  }
  .ticket-card h1{ font-family:'Big Shoulders Display',sans-serif; font-weight:800; font-size:clamp(2rem,4vw,2.7rem); line-height:.98; color:var(--paper); margin:0; }
  .ticket-card__sub{ font-family:'IBM Plex Sans',sans-serif; color:var(--steel); font-size:.95rem; line-height:1.6; margin:.8rem 0 1.8rem; }
  .ticket-card label{ display:block; margin-bottom:1.1rem; font-family:'IBM Plex Mono',monospace; font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; color:var(--steel); }
  .ticket-card input{
    display:block; width:100%; margin-top:.5rem; padding:.75rem .9rem;
    background:rgba(5,7,13,.5); border:1px solid rgba(142,151,171,.35); border-radius:2px;
    color:var(--paper); font-family:'IBM Plex Sans',sans-serif; font-size:1rem;
  }
  .ticket-card input:focus-visible{ border-color:var(--gold); }
  .ticket-card button{
    width:100%; margin-top:.4rem; padding:.9rem 1.2rem; border:none; border-radius:2px;
    background:var(--gold); color:var(--ink); font-family:'IBM Plex Mono',monospace;
    font-size:.78rem; letter-spacing:.14em; text-transform:uppercase; font-weight:600; cursor:pointer;
    transition:background .25s ease;
  }
  .ticket-card button:hover{ background:var(--gold-pale); }
  .ticket-card__success{ font-family:'IBM Plex Sans',sans-serif; color:var(--gold-pale); font-size:1.05rem; line-height:1.6; margin:0; }
  .ticket-card__success strong{ display:block; font-family:'Big Shoulders Display',sans-serif; font-size:1.6rem; color:var(--paper); margin-bottom:.5rem; }

  @media (max-width:760px){
    .ticket-hero__scrim{ background:linear-gradient(180deg, rgba(5,7,13,.35) 0%, rgba(5,7,13,.92) 62%); }
    .ticket-hero__inner{ justify-content:center; padding-top:7rem; }
  }

  .footer{
    background:var(--ink); padding:clamp(2rem,6vw,3rem) clamp(1.5rem,5vw,3rem);
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:1.5rem;
    border-top:1px solid rgba(201,169,106,.12);
  }
  .footer__mark{ font-family:'Big Shoulders Display',sans-serif; font-weight:800; font-size:1.3rem; color:var(--paper); }
  .footer__links{ display:flex; gap:1.6rem; flex-wrap:wrap; }
  .footer__links a{ font-family:'IBM Plex Mono',monospace; font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; color:var(--steel); text-decoration:none; }
  .footer__links a:hover, .footer__links a:focus-visible{ color:var(--gold-pale); }
  .footer__links-active{ font-family:'IBM Plex Mono',monospace; font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); }
</style>
</head>
