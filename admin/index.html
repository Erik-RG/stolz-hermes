<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Stolz Hermes — Signups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#05070d; --navy:#0d1b34; --navy-soft:#152947;
    --gold:#c9a96a; --gold-pale:#e9dcb8; --paper:#f3efe6; --steel:#8e97ab;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  body{ margin:0; background:var(--ink); color:var(--paper); font-family:'IBM Plex Sans',sans-serif; -webkit-font-smoothing:antialiased; }
  a{ color:inherit; }
  a:focus-visible, button:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }

  header{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1rem;
    padding:1.4rem clamp(1.2rem,4vw,2.5rem); border-bottom:1px solid rgba(201,169,106,.18);
  }
  .mark{ display:flex; align-items:center; gap:.7rem; text-decoration:none; }
  .mark-shield{
    width:32px; height:32px; display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:.68rem; color:var(--ink); background:var(--gold);
    clip-path:polygon(50% 0%, 100% 15%, 100% 72%, 50% 100%, 0% 72%, 0% 15%);
  }
  .mark-text{ font-family:'IBM Plex Mono',monospace; font-size:.7rem; letter-spacing:.18em; color:var(--paper); }
  header a.home{ font-family:'IBM Plex Mono',monospace; font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; color:var(--steel); text-decoration:none; }
  header a.home:hover{ color:var(--gold-pale); }

  main{ padding:clamp(1.5rem,5vw,3rem); max-width:1000px; margin:0 auto; }
  .eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:.75rem; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); display:block; margin-bottom:.6rem; }
  h1{ font-family:'Big Shoulders Display',sans-serif; font-weight:800; font-size:clamp(1.8rem,4vw,2.6rem); margin:0 0 .3rem; }
  .summary{ font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--steel); margin:0 0 1.8rem; }

  .toolbar{ display:flex; justify-content:flex-end; margin-bottom:1rem; }
  button.refresh{
    background:transparent; border:1px solid rgba(201,169,106,.4); color:var(--gold-pale);
    font-family:'IBM Plex Mono',monospace; font-size:.72rem; letter-spacing:.1em; text-transform:uppercase;
    padding:.6rem 1.1rem; border-radius:2px; cursor:pointer; transition:background .2s ease;
  }
  button.refresh:hover{ background:rgba(201,169,106,.12); }

  .table-wrap{ overflow-x:auto; border:1px solid rgba(142,151,171,.2); border-radius:3px; }
  table{ width:100%; border-collapse:collapse; font-family:'IBM Plex Sans',sans-serif; font-size:.92rem; }
  thead th{
    text-align:left; font-family:'IBM Plex Mono',monospace; font-size:.68rem; letter-spacing:.1em; text-transform:uppercase;
    color:var(--steel); background:var(--navy); padding:.9rem 1rem; border-bottom:1px solid rgba(201,169,106,.2);
  }
  tbody td{ padding:.85rem 1rem; border-bottom:1px solid rgba(142,151,171,.12); color:var(--paper); }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:rgba(21,41,71,.4); }

  .state-row{ font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--steel); padding:2rem 1rem; text-align:center; }
</style>
</head>
<body>

  <header>
    <a href="../" class="mark">
      <span class="mark-shield">SH</span>
      <span class="mark-text">STOLZ HERMES</span>
    </a>
    <a href="../" class="home">View site</a>
  </header>

  <main>
    <span class="eyebrow">Internal</span>
    <h1>Ticket signups</h1>
    <p class="summary" id="signupCount">Loading…</p>

    <div class="toolbar">
      <button class="refresh" id="refreshBtn" type="button">Refresh</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Submitted</th><th>Name</th><th>Email</th><th>Seats</th></tr>
        </thead>
        <tbody id="signupBody"></tbody>
      </table>
      <div class="state-row" id="loadingState">Loading signups…</div>
      <div class="state-row" id="emptyState" hidden>No signups yet.</div>
    </div>
  </main>

  <script>
    var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxjuW5IVuL6y-uzx8c9ztkst9e9ltumwm2QeUy46ZlC6NYbX_CcBUXdAHx58Gs0VMTm/exec";

    function escapeHtml(str){
      return String(str == null ? '' : str).replace(/[&<>"']/g, function(c){
        return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
      });
    }

    function formatDate(value){
      var d = new Date(value);
      if (isNaN(d.getTime())) return String(value);
      return d.toLocaleString();
    }

    function loadSignups(data){
      var rows = data.signups || [];
      var tbody = document.getElementById('signupBody');
      var empty = document.getElementById('emptyState');
      var loading = document.getElementById('loadingState');
      var count = document.getElementById('signupCount');
      var totalSeats = 0;

      tbody.innerHTML = '';
      loading.hidden = true;

      if (rows.length === 0){
        empty.hidden = false;
      } else {
        empty.hidden = true;
        rows.slice().reverse().forEach(function(row){
          var seats = Number(row.tickets) || 1;
          totalSeats += seats;
          var tr = document.createElement('tr');
          tr.innerHTML =
            '<td>' + escapeHtml(formatDate(row.timestamp)) + '</td>' +
            '<td>' + escapeHtml(row.name) + '</td>' +
            '<td>' + escapeHtml(row.email) + '</td>' +
            '<td>' + escapeHtml(String(seats)) + '</td>';
          tbody.appendChild(tr);
        });
      }

      count.textContent = rows.length + ' signup' + (rows.length === 1 ? '' : 's') +
        ' · ' + totalSeats + ' seat' + (totalSeats === 1 ? '' : 's') + ' requested';
    }

    function fetchSignups(){
      document.getElementById('loadingState').hidden = false;
      document.getElementById('emptyState').hidden = true;
      document.getElementById('signupCount').textContent = 'Loading…';
      var existing = document.getElementById('jsonpScript');
      if (existing) existing.remove();
      var script = document.createElement('script');
      script.id = 'jsonpScript';
      script.src = SCRIPT_URL + '?callback=loadSignups&_=' + Date.now();
      document.body.appendChild(script);
    }

    document.getElementById('refreshBtn').addEventListener('click', fetchSignups);
    fetchSignups();
  </script>
</body>
</html>
